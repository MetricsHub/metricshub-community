connector:
  detection:
    appliesTo: [ linux ]
extends:
- removalDelayHeader
monitors:
  overridden:
    removalDelay: 30s
  plain_number:
    removalDelay: 90
    simple:
      mapping: { type: simple }
  absent:
    simple:
      mapping: { type: simple }
  null_value:
    removalDelay:
    simple:
      mapping: { type: simple }
