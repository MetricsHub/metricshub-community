---
connector:
  detection:
    appliesTo: [ linux ]
    criteria:
    - type: wbem
      query: testQuery
      namespace: testNamespace
      expectedResult: testExpectedResult

tools:
  reboot:
    description: Reboots the server.
    destructive: true
    parameters:
      mode:
        type: string
        description: GracefulRestart or ForceRestart
        default: GracefulRestart
        enum: [ GracefulRestart, ForceRestart ]
      comment:
        description: Why the server is rebooted
        default: ''
    sources:
      reset:
        type: http
        method: post
        path: /redfish/v1/Systems/1/Actions/ComputerSystem.Reset
        body: '{"ResetType": "${param::mode}", "Comment": "${esc(json)::param::comment}"}'
      status:
        type: tableUnion
        tables:
        - ${source::reset}
    result:
      source: ${source::status}
      columns: [ status ]
