connector:
  displayName: TestConnectorWithSimpleMapping
  platforms: Test platform
  reliesOn: SomeCommand
  version: 1.0
  information: Test connector for the simple mapping, a mapping without a source
  detection:
    appliesTo:
      - Linux
    criteria:
      - type: deviceType
        keep: [ linux ]
monitors:
  # Simple job: one instance, its values are constants and texts
  settings:
    simple:
      sources:
        vendor:
          type: commandLine
          commandLine: vendor
        limit:
          type: commandLine
          commandLine: limit
        failed:
          type: commandLine
          commandLine: failed
      mapping:
        attributes:
          id: settings
          vendor: ${source::vendor}
          location: ${source::failed}
          name: Settings of ${source::vendor}
        metrics:
          test.count: 1
          test.limit: ${source::limit}
          test.failed: ${source::failed}
  # Discovery and mono-instance collect, both with a simple mapping
  mono:
    discovery:
      sources:
        vendor:
          type: commandLine
          commandLine: vendor
      mapping:
        attributes:
          id: mono
          vendor: ${source::vendor}
    collect:
      type: monoInstance
      sources:
        limit:
          type: commandLine
          commandLine: limit
      mapping:
        metrics:
          test.limit: ${source::limit}
  # Discovery and multi-instance collect, both with a simple mapping
  multi:
    discovery:
      mapping:
        attributes:
          id: multi
    collect:
      type: multiInstance
      keys: [ id ]
      sources:
        limit:
          type: commandLine
          commandLine: limit
      mapping:
        attributes:
          id: multi
        metrics:
          test.limit: ${source::limit}
  # A mapping with a source: one instance per row, a text in a value
  rows:
    simple:
      sources:
        table:
          type: snmpTable
          oid: 1.3.6.1.1
          selectColumns: "ID,1"
        vendor:
          type: commandLine
          commandLine: vendor
      mapping:
        source: ${source::table}
        attributes:
          id: $1
          vendor: ${source::vendor}
        metrics:
          test.limit: $2
