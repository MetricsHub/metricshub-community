connector:
  displayName: Tool test connector
  platforms: Test platform
  reliesOn: Nothing
  version: 1.0
  information: Declares one tool built on static sources
  detection:
    appliesTo:
      - Linux
    criteria:
      - type: snmpGetNext
        oid: 1.3.6.1.4.1.795.10.1.1.3.1.1
tools:
  listThings:
    description: Lists the things whose name matches a pattern.
    parameters:
      pattern:
        description: Regular expression on the thing name
        default: .*
      owner:
        description: Who the things belong to
        required: true
    sources:
      things:
        type: static
        value: |-
          alpha;1
          beta;2
          gamma;3
        computes:
        - type: keepOnlyMatchingLines
          column: 1
          regExp: ${param::pattern}
      owned:
        type: static
        value: ${source::things}
        computes:
        - type: append
          column: 2
          value: -${param::owner}
    result:
      source: ${source::owned}
      columns: [ name, value ]
  withSession:
    description: Uses the session token the connector fetched in beforeAll.
    sources:
      authenticated:
        type: static
        value: ${source::beforeAll.session}
        computes:
        - type: append
          column: 1
          value: -used
    result:
      source: ${source::authenticated}
beforeAll:
  session:
    type: static
    value: token-123
afterAll:
  logout:
    type: static
    value: bye
