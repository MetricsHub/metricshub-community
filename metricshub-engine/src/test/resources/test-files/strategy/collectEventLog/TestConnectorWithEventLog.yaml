connector:
  displayName: TestConnectorWithEventLog
  platforms: Test platform
  reliesOn: SomeWebService
  version: 1.0
  information: Test connector whose mono instance collect polls an incremental eventLog source for each monitor
  detection:
    connectionTypes:
      - remote
      - local
    appliesTo:
      - Linux
    criteria:
      - type: deviceType
        keep: [ linux ]
monitors:
  event_log:
    discovery:
      sources:
        source(1):
          type: snmpTable
          oid: 1.3.6.1.1
          selectColumns: "ID,1"
      mapping:
        source: "${source::monitors.event_log.discovery.sources.source(1)}"
        attributes:
          id: $1
    collect:
      type: monoInstance
      sources:
        source(1):
          type: eventLog
          logName: System
      mapping:
        source: "${source::monitors.event_log.collect.sources.source(1)}"
        legacyTextParameters:
          StatusInformation: $2
