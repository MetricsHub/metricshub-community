# A connector written the way third-party connectors were written before the content types of #1508: it relies on
# every implicit conversion and legacy idiom the desugaring handles. ContentTypeCompatibilityTest pins what the engine
# makes of it, so that a change of these results is a reviewed, documented change for connector authors.
connector:
  displayName: Legacy idioms
  platforms: Any
  reliesOn: Nothing
  detection:
    appliesTo:
    - linux
    criteria:
    - type: commandLine
      commandLine: uname
monitors:
  # A command output read as a table: a table compute right after it (implicit toTable), short rows
  command_table:
    discovery:
      sources:
        lines:
          type: commandLine
          commandLine: cat lines
          computes:
          - type: keepColumns
            columnNumbers: 1,3
          - type: append
            column: 1
            value: _id
      mapping:
        source: ${source::monitors.command_table.discovery.sources.lines}
        attributes:
          id: $1
          name: $2
  # A command output mapped as it is (implicit toTable appended)
  command_mapped:
    discovery:
      sources:
        raw:
          type: commandLine
          commandLine: cat raw
          computes:
          - type: keepOnlyMatchingLines
            column: 1
            regExp: .
      mapping:
        source: ${source::monitors.command_mapped.discovery.sources.raw}
        attributes:
          id: $1
          name: $3
  # An awk splitting a table on ";" (implicit toText): trailing field, ";" inside a cell
  awk_on_table:
    discovery:
      sources:
        rows:
          type: wmi
          query: SELECT Name, Status, Size FROM Disks
          namespace: root\cimv2
          computes:
          - type: awk
            script: |
              BEGIN { FS = ";" }
              { print $1 ";" $2 ";" NF ";" $NF }
      mapping:
        source: ${source::monitors.awk_on_table.discovery.sources.rows}
        attributes:
          id: $1
          name: $2
  # A table compute on an HTTP body (no table) and a text compute on a table
  wrong_side:
    discovery:
      sources:
        body:
          type: http
          method: get
          path: /status
          computes:
          - type: replace
            column: 1
            existingValue: a
            newValue: b
        json:
          type: snmpTable
          oid: 1.3.6.1.4.1
          selectColumns: ID,1,2
          computes:
          - type: json2Csv
            entryKey: /
            properties: name
            separator: ;
      mapping:
        source: ${source::monitors.wrong_side.discovery.sources.json}
        attributes:
          id: $1
  # Values holding the separator or a line feed
  separator_values:
    discovery:
      sources:
        values:
          type: snmpTable
          oid: 1.3.6.1.4.1.2
          selectColumns: ID,1,2
          computes:
          - type: prepend
            column: 1
            value: MSHW;
          - type: append
            column: 3
            value: ;x
          - type: replace
            column: 2
            existingValue: a
            newValue: "a;b"
          - type: translate
            column: 4
            translationTable: ${translation::splitTranslation}
          - type: append
            column: 2
            value: "\nextra"
      mapping:
        source: ${source::monitors.separator_values.discovery.sources.values}
        attributes:
          id: $1
          name: $2
  # A command output read both as a table (mapped) and as text (copied into an awk)
  dual_read:
    discovery:
      sources:
        output:
          type: commandLine
          commandLine: cat output
        parsed:
          type: copy
          from: ${source::monitors.dual_read.discovery.sources.output}
          computes:
          - type: awk
            script: |
              BEGIN { FS = ";" }
              { print $1 ";" NF }
      mapping:
        source: ${source::monitors.dual_read.discovery.sources.output}
        attributes:
          id: $1
  # A literal copied into an awk, and a union of commands parsed by an awk and joined to a table
  literals_and_unions:
    discovery:
      sources:
        literal:
          type: copy
          from: a;b;c
          computes:
          - type: awk
            script: |
              BEGIN { FS = ";" }
              { print NF ";" $0 }
        first:
          type: commandLine
          commandLine: cat first
        second:
          type: commandLine
          commandLine: cat second
        union:
          type: tableUnion
          tables:
          - ${source::monitors.literals_and_unions.discovery.sources.first}
          - ${source::monitors.literals_and_unions.discovery.sources.second}
          computes:
          - type: awk
            script: |
              BEGIN { FS = ";" }
              { print $1 ";" NF }
        static:
          type: static
          value: x;y;z
          computes:
          - type: awk
            script: '{ print $0 }'
      mapping:
        source: ${source::monitors.literals_and_unions.discovery.sources.union}
        attributes:
          id: $1
translations:
  splitTranslation:
    a: "one;two"
    Default: other
