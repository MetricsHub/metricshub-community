connector:
  displayName: Tool test connector
  platforms: Test platform
  reliesOn: Nothing
  version: 1.0
  information: Declares one tool built on static sources
  detection:
    appliesTo:
      - Linux
    criteria:
      - type: snmpGetNext
        oid: 1.3.6.1.4.1.795.10.1.1.3.1.1
tools:
  listThings:
    description: Lists the things whose name matches a pattern.
    parameters:
      pattern:
        description: Regular expression on the thing name
        default: .*
        # Inserted as is, a regular expression: anything but the column separator
        pattern: '[^;]*'
      owner:
        description: Who the things belong to
        required: true
        pattern: \w+
    sources:
      things:
        type: static
        value: |-
          alpha;1
          beta;2
          gamma;3
        computes:
        - type: keepOnlyMatchingLines
          column: 1
          regExp: ${param::pattern}
      owned:
        type: static
        value: ${source::things}
        computes:
        - type: append
          column: 2
          value: -${param::owner}
    result:
      source: ${source::owned}
      columns: [ name, value ]
  reboot:
    description: Pretends to reboot.
    destructive: true
    sources:
      reset:
        type: static
        value: done
    result:
      source: ${source::reset}
