# Build and test on Windows with a CRLF checkout (core.autocrlf=true), so that the build and
# the tests stay independent of line endings (#1400). The Linux build runs in maven-build.yml.

name: Test - Windows
run-name: Test - Windows ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches: [ "main", "EPIC-*" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  verify-windows:
    name: Verify on Windows

    runs-on: windows-latest

    steps:
    - name: Check out with CRLF line endings
      run: git config --global core.autocrlf true

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: "25"
        distribution: temurin

    # Same cache scheme as maven-build.yml: closest match restored, saved from main only
    - name: Restore Maven repository
      id: maven-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: maven-${{ runner.os }}-

    - name: Set up Maven settings.xml
      uses: s4u/maven-settings-action@v4.1.0
      with:
        override: true
        repositories: |
          [
            {
              "id": "metricshub",
              "name": "metricshub-repository",
              "url": "https://repo.metricshub.com/repository/maven-public",
              "snapshots": { "enabled": true },
              "releases": { "enabled": true }
            }
          ]
        pluginRepositories: |
          [
            {
              "id": "metricshub",
              "name": "metricshub-repository",
              "url": "https://repo.metricshub.com/repository/maven-public",
              "snapshots": { "enabled": true },
              "releases": { "enabled": true }
            }
          ]
        servers: |
          [
            {
              "id": "metricshub",
              "username": "${env.REPO_METRICSHUB_USERNAME}",
              "password": "${env.REPO_METRICSHUB_TOKEN}"
            }
          ]

    # Community connectors next to the checkout, so that the compute-chain golden corpus is verified on a CRLF
    # checkout as well (see maven-build.yml)
    - name: Checkout the community connectors for the golden corpus
      run: git clone --depth 1 --branch main https://github.com/MetricsHub/community-connectors.git ../metricshub-community-connectors

    - name: Verify with Maven
      run: mvn --batch-mode --file pom.xml clean verify
      env:
        REPO_METRICSHUB_USERNAME: ${{ secrets.REPO_METRICSHUB_USERNAME }}
        REPO_METRICSHUB_TOKEN: ${{ secrets.REPO_METRICSHUB_TOKEN }}

    - name: Save Maven repository
      if: github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.m2/repository
        key: ${{ steps.maven-cache.outputs.cache-primary-key }}

    - name: Check that the build changed no tracked file
      shell: bash
      run: |
        git status --porcelain
        test -z "$(git status --porcelain --untracked-files=no)"
