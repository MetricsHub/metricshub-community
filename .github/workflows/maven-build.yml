# Reusable Build with Maven
#
# This is not a release workflow, use it to build
# and/or deploy a SNAPSHOT version of your project.
#
# Call this workflow on push to the base branch.
#
# Dependencies are resolved from, and SNAPSHOTs deployed to, repo.metricshub.com.
#
# Requirements:
#
# - REPO_METRICSHUB_USERNAME secret (at the repository or organization level)
# - REPO_METRICSHUB_TOKEN secret
#

name: Maven Build
run-name: Maven ${{ github.head_ref }} Build

on:
  workflow_call:
    inputs:
      jdkVersion:
        type: string
        description: "Version of the JDK to setup and use"
        required: false
        default: "25"
      mavenPhases:
        type: string
        description: "Maven phases to run (e.g., clean verify)"
        required: false
        default: "clean verify"
      mavenOptions:
        type: string
        description: "Additional Maven options (e.g., -DskipTests)"
        required: false
        default: ""
      debug:
        type: boolean
        description: "Enable Maven debug"
        required: false
        default: false
      ssh:
        type: boolean
        description: "Enable SSH session to the runner"
        required: false
        default: false
      additionalInstallPath:
        type: boolean
        description: "Additional install path for Maven artifacts"
        required: false
        default: false
    outputs:
      mavenArtifact:
        description: "Path to the Maven artifacts when additionalInstallPath is set to true"
        value: ${{ jobs.build.outputs.mavenArtifact }}
      packageArtifact:
        description: "Path to the Maven artifacts when additionalInstallPath is set to true"
        value: ${{ jobs.build.outputs.packageArtifacts }}
      version:
        description: "Version of the project as determined by Maven"
        value: ${{ jobs.build.outputs.version }}

permissions:
  # This is required for report upload
  checks: write
  contents: write
  pull-requests: write

jobs:

  build:
    name: Build with Maven

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK ${{ inputs.jdkVersion }}
      id: jdk
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.jdkVersion }}
        distribution: temurin

    # Restore the closest Maven repository, even when a pom.xml changed. Only main saves it
    # (below), so pull requests don't evict main's cache from the 10 GB budget.
    # ponytail: restored entries keep stale versions; delete the main cache entries if it grows too big
    - name: Restore Maven repository
      id: maven-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: maven-${{ runner.os }}-

    - name: Set up Maven settings.xml
      uses: s4u/maven-settings-action@v4.1.0
      with:
        override: true
        repositories: |
          [
            {
              "id": "metricshub",
              "name": "metricshub-repository",
              "url": "https://repo.metricshub.com/repository/maven-public",
              "snapshots": { "enabled": true },
              "releases": { "enabled": true }
            }
          ]
        pluginRepositories: |
          [
            {
              "id": "metricshub",
              "name": "metricshub-repository",
              "url": "https://repo.metricshub.com/repository/maven-public",
              "snapshots": { "enabled": true },
              "releases": { "enabled": true }
            }
          ]
        servers: |
          [
            {
              "id": "metricshub",
              "username": "${env.REPO_METRICSHUB_USERNAME}",
              "password": "${env.REPO_METRICSHUB_TOKEN}"
            }
          ]

    - name: Setup tmate SSH session
      uses: mxschmitt/action-tmate@v3
      with:
        detached: true
        sudo: true
        install-dependencies: true
      if: ${{ inputs.ssh }}

    - name: Configure additional installation path for Maven artifacts
      shell: bash
      run: echo "additionalInstallPath=${{ runner.temp }}/maven" >> $GITHUB_ENV
      if: ${{ inputs.additionalInstallPath }}

    - name: Set Debug Flag
      id: debug_flag
      shell: bash
      run: echo "flag=${RUNNER_DEBUG:-0}" >> $GITHUB_OUTPUT

    - name: Configure Maven debug flag
      shell: bash
      run: echo "debugFlag=--debug" >> $GITHUB_ENV
      if: ${{ inputs.debug || steps.debug_flag.outputs.flag == '1'}}

    - name: Get Project Version
      id: version
      run: |
        echo "version=$(mvn help:evaluate -Dexpression=project.version -q -N -DforceStdout)" >> $GITHUB_OUTPUT
      env:
        REPO_METRICSHUB_USERNAME: ${{ secrets.REPO_METRICSHUB_USERNAME }}
        REPO_METRICSHUB_TOKEN: ${{ secrets.REPO_METRICSHUB_TOKEN }}

    # The compute-chain golden corpus (metricshub-engine, ComputeChainGoldenCorpusTest) verifies the committed
    # goldens against the connectors of the repositories found next to this checkout, and is skipped when none
    # is there. The community repository is public: check it out so that pull requests and main verify its goldens.
    # The enterprise repository is private and is verified locally only.
    - name: Checkout the community connectors for the golden corpus
      run: git clone --depth 1 --branch main https://github.com/MetricsHub/community-connectors.git ../metricshub-community-connectors

    - name: Build with Maven
      run: mvn ${{ env.debugFlag }} --batch-mode --file pom.xml ${{ inputs.mavenPhases }} ${{ inputs.mavenOptions }}
      env:
        LOCAL_REPOSITORY_PATH_INSTALL: ${{ env.additionalInstallPath }}
        REPO_METRICSHUB_USERNAME: ${{ secrets.REPO_METRICSHUB_USERNAME }}
        REPO_METRICSHUB_TOKEN: ${{ secrets.REPO_METRICSHUB_TOKEN }}

    - name: Save Maven repository
      if: github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.m2/repository
        key: ${{ steps.maven-cache.outputs.cache-primary-key }}

    - name: Upload Maven Artifacts
      uses: actions/upload-artifact@v7
      if: ${{ inputs.additionalInstallPath }}
      with:
        name: maven-artifacts
        include-hidden-files: true
        path: ${{ env.additionalInstallPath }}

    - name: Prepare packaging assets
      run: |
        mkdir -p packaging-assets
        cp metricshub-assets/target/assets-*.zip packaging-assets/
        cp -r metricshub-assets/target/assets-docker/* packaging-assets/
        cp -r metricshub-assets/target/assets-packaging/* packaging-assets/
        ls -l packaging-assets/

    - name: Upload Community Package Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: package-artifacts
        include-hidden-files: true
        path: packaging-assets/

    - name: Upload Checkstyle reports to GitHub
      uses: jwgmeligmeyling/checkstyle-github-action@v1.2
      with:
        path: "**/checkstyle-result.xml"

    - name: Upload Spotbugs reports to GitHub
      uses: jwgmeligmeyling/spotbugs-github-action@v1.2
      with:
        path: "**/spotbugsXml.xml"

    - name: Upload PMD reports to GitHub
      uses: jwgmeligmeyling/pmd-github-action@v1.2
      with:
        path: "**/pmd.xml"

    # Collect Maven build outputs
    outputs:
      mavenArtifact: maven-artifacts
      packageArtifacts: package-artifacts
      version: ${{ steps.version.outputs.version }}
